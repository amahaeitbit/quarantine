# Dark theme for the console. Colours follow console/style.py.
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
font = "sans serif"

[browser]
gatherUsageStats = false

# Local only: anyone who can open the console can reset the demo.
[server]
address = "localhost"
